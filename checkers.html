<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkers — Just.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(8, 56px);
    grid-template-rows: repeat(8, 56px);
    width: fit-content;
    margin: 0 auto;
    border: 1px solid var(--border);
  }
  .sq {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .sq.light { background: #f0ede4; }
  .sq.dark { background: #b0a898; cursor: pointer; }
  [data-theme="dark"] .sq.light { background: #2e2a24; }
  [data-theme="dark"] .sq.dark { background: #1c1a16; }
  .sq.possible { background: rgba(80,160,80,0.4) !important; }
  .piece {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    transition: transform 0.1s;
    position: relative;
    z-index: 1;
  }
  .piece.red { background: #c0392b; border: 2px solid #e74c3c; color: #fff; }
  .piece.black { background: #2c2c2c; border: 2px solid #555; color: #fff; }
  [data-theme="dark"] .piece.red { background: #c0392b; border-color: #e07070; }
  [data-theme="dark"] .piece.black { background: #444; border-color: #888; }
  .piece.selected { transform: scale(1.12); }
  .piece.king::after { content: '♛'; position:absolute; font-size:0.9rem; }
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Back</a>
  <a href="../index.html" class="logo">Just<em>.</em></a>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark</button>
  </div>
</header>

<div class="game-container">
  <div class="game-title">Checkers</div>
  <div class="game-subtitle">Pass the device · Two players</div>
  <div class="status-bar">
    <span>Turn</span><span class="status-val" id="turnInd">Red</span>
    <span>Red</span><span class="status-val" id="redCount">12</span>
    <span>Black</span><span class="status-val" id="blackCount">12</span>
  </div>

  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div style="text-align:center;margin-top:1rem">
    <button class="btn btn-outline" onclick="newGame()">New Game</button>
  </div>
</div>

<script>
// board[r][c] = {color:'r'|'b', king:bool} or null
let board, turn, selected, possible, mustJump, over;

function newGame(){
  board=Array(8).fill(null).map(()=>Array(8).fill(null));
  for(let r=0;r<3;r++) for(let c=0;c<8;c++) if((r+c)%2!==0) board[r][c]={color:'b',king:false};
  for(let r=5;r<8;r++) for(let c=0;c<8;c++) if((r+c)%2!==0) board[r][c]={color:'r',king:false};
  turn='r'; selected=null; possible=[]; mustJump=false; over=false;
  document.getElementById('msg').textContent='';
  document.getElementById('msg').className='msg';
  updateCounts(); render();
}

function updateCounts(){
  let r=0,b=0;
  for(let row=0;row<8;row++) for(let col=0;col<8;col++){
    if(board[row][col]?.color==='r') r++;
    if(board[row][col]?.color==='b') b++;
  }
  document.getElementById('redCount').textContent=r;
  document.getElementById('blackCount').textContent=b;
  document.getElementById('turnInd').textContent=turn==='r'?'Red':'Black';
}

function getMoves(r,c,jumpOnly=false){
  const p=board[r][c]; if(!p) return [];
  const dirs=p.king?[-1,1]:(p.color==='r'?[-1]:[1]);
  const jumps=[],moves=[];
  for(const dr of dirs) for(const dc of[-1,1]){
    const nr=r+dr, nc=c+dc, jr=r+2*dr, jc=c+2*dc;
    if(nr>=0&&nr<8&&nc>=0&&nc<8){
      if(board[nr][nc]?.color&&board[nr][nc].color!==p.color){
        if(jr>=0&&jr<8&&jc>=0&&jc<8&&!board[jr][jc]) jumps.push({r:jr,c:jc,capR:nr,capC:nc});
      } else if(!board[nr][nc]&&!jumpOnly) moves.push({r:nr,c:nc});
    }
  }
  return jumps.length ? jumps : (jumpOnly ? [] : moves);
}

function allJumps(){
  const jumps=[];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(board[r][c]?.color===turn) if(getMoves(r,c,true).length) jumps.push([r,c]);
  return jumps;
}

function click(r,c){
  if(over) return;
  const haveJumps=allJumps();
  if(selected){
    const move=possible.find(m=>m.r===r&&m.c===c);
    if(move){ doMove(...selected,move); return; }
    if(board[r][c]?.color===turn){
      selected=[r,c];
      const moves=getMoves(r,c,haveJumps.length>0);
      if(haveJumps.length&&!haveJumps.some(([jr,jc])=>jr===r&&jc===c)){possible=[];}
      else possible=moves;
    } else { selected=null; possible=[]; }
  } else {
    if(board[r][c]?.color===turn){
      if(haveJumps.length&&!haveJumps.some(([jr,jc])=>jr===r&&jc===c)){ return; }
      selected=[r,c];
      possible=getMoves(r,c,haveJumps.length>0);
    }
  }
  render();
}

function doMove(fr,fc,move){
  board[move.r][move.c]=board[fr][fc]; board[fr][fc]=null;
  if(move.capR!==undefined) board[move.capR][move.capC]=null;
  // King promotion
  const p=board[move.r][move.c];
  if(p.color==='r'&&move.r===0) p.king=true;
  if(p.color==='b'&&move.r===7) p.king=true;
  selected=null; possible=[];
  // Chain jumps
  if(move.capR!==undefined){
    const chains=getMoves(move.r,move.c,true);
    if(chains.length){ selected=[move.r,move.c]; possible=chains; updateCounts(); render(); return; }
  }
  turn=turn==='r'?'b':'r';
  updateCounts();
  // Check win
  const opp=turn==='r'?'b':'r';
  let oppHas=false;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(board[r][c]?.color===turn) if(getMoves(r,c).length){oppHas=true;break;}
  if(!oppHas){
    over=true;
    const msg=document.getElementById('msg');
    msg.textContent=`${opp==='r'?'Red':'Black'} wins!`; msg.className='msg win';
  }
  render();
}

function render(){
  const b=document.getElementById('board');
  b.innerHTML='';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const sq=document.createElement('div');
    sq.className=`sq ${(r+c)%2===0?'light':'dark'}`;
    if(possible.some(m=>m.r===r&&m.c===c)) sq.classList.add('possible');
    const p=board[r][c];
    if(p){
      const piece=document.createElement('div');
      piece.className=`piece ${p.color==='r'?'red':'black'}${p.king?' king':''}`;
      if(selected&&selected[0]===r&&selected[1]===c) piece.classList.add('selected');
      sq.appendChild(piece);
    }
    const rr=r,cc=c; sq.addEventListener('click',()=>click(rr,cc));
    b.appendChild(sq);
  }
}

const saved = localStorage.getItem('just-theme');
if (saved === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent='Light'; }
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');document.getElementById('themeBtn').textContent='Dark';localStorage.setItem('just-theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='Light';localStorage.setItem('just-theme','dark');}
  render();
}

newGame();
</script>
</body>
</html>
