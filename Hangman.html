<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Hangman</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #hangman-container { text-align: center; }
        #word-display { font-size: 2.5rem; letter-spacing: 10px; margin: 20px; font-family: monospace; }
        #gallows { font-size: 1.5rem; font-family: monospace; white-space: pre; margin: 20px; }
        #keyboard { max-width: 500px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .key { padding: 10px; border: 1px solid #000; cursor: pointer; min-width: 35px; }
        .key.used { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <div id="hangman-container">
        <h1>Hangman</h1>
        <div id="gallows">
  +---+
  |   |
      |
      |
      |
      |
=========</div>
        <div id="word-display">_ _ _ _ _</div>
        <div id="keyboard"></div>
        <p id="message"></p>
        <button onclick="location.reload()" id="reset" style="display:none; padding: 10px; cursor: pointer;">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
