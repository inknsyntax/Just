<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Just Wordle</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-board { display: grid; gap: 5px; max-width: 300px; margin: 20px auto; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 50px; height: 50px; border: 2px solid #ccc; text-align: center; line-height: 50px; font-weight: bold; text-transform: uppercase; }
        .correct { background: #6aaa64; color: white; border-color: #6aaa64; }
        .present { background: #c9b458; color: white; border-color: #c9b458; }
        .absent { background: #787c7e; color: white; border-color: #787c7e; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <div style="text-align: center;">
        <h1>Wordle</h1>
        <div id="game-board"></div>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
