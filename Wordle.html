<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Wordle</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { display: flex; flex-direction: column; align-items: center; }
        #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 50px; height: 50px; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        .correct { background: #6aaa64; border-color: #6aaa64; color: white; }
        .present { background: #c9b458; border-color: #c9b458; color: white; }
        .absent { background: #787c7e; border-color: #787c7e; color: white; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <div id="game-container">
        <h1>Wordle</h1>
        <div id="board"></div>
        <p id="message"></p>
        <button onclick="location.reload()" id="reset" style="display:none; padding: 10px; cursor: pointer;">Play Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
