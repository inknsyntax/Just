<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — Just.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    width: 300px;
    height: 300px;
    margin: 0 auto 1.5rem;
    border: 1.5px solid var(--border);
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 3rem;
    cursor: pointer;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    color: var(--text);
    user-select: none;
  }
  .cell:nth-child(3n) { border-right: none; }
  .cell:nth-child(n+7) { border-bottom: none; }
  .cell:hover:empty { background: var(--hover); }
  .cell.x { color: var(--text); }
  .cell.o { color: var(--text2); }
  .cell.win { background: var(--hover); }
  .scores {
    display: flex;
    justify-content: center;
    gap: 3rem;
    margin-bottom: 1.5rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text2);
  }
  .score-block { text-align: center; }
  .score-num {
    font-family: 'Instrument Serif', serif;
    font-size: 2rem;
    color: var(--text);
    display: block;
    line-height: 1.1;
  }
  .turn-indicator {
    text-align: center;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text2);
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Back</a>
  <a href="../index.html" class="logo">Just<em>.</em></a>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark</button>
  </div>
</header>

<div class="game-container">
  <div class="game-title">Tic-Tac-Toe</div>
  <div class="game-subtitle">Pass the device · Two players</div>

  <div class="scores">
    <div class="score-block"><span class="score-num" id="scoreX">0</span>X</div>
    <div class="score-block"><span class="score-num" id="scoreTie">0</span>Ties</div>
    <div class="score-block"><span class="score-num" id="scoreO">0</span>O</div>
  </div>

  <div class="turn-indicator" id="turnInd">X's turn</div>

  <div class="board" id="board"></div>

  <div class="msg" id="msg"></div>

  <div style="text-align:center;margin-top:0.5rem">
    <button class="btn btn-outline" onclick="newGame()">New Game</button>
  </div>
</div>

<script>
let board, turn, over, scores = {X:0, O:0, T:0};
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function newGame() {
  board = Array(9).fill('');
  turn = 'X'; over = false;
  render();
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = 'msg';
  document.getElementById('turnInd').textContent = "X's turn";
}

function move(i) {
  if (board[i] || over) return;
  board[i] = turn;
  const win = checkWin();
  if (win) {
    over = true;
    scores[turn]++;
    updateScores();
    win.forEach(i => document.querySelectorAll('.cell')[i].classList.add('win'));
    const msg = document.getElementById('msg');
    msg.textContent = `${turn} wins.`;
    msg.className = 'msg win';
    document.getElementById('turnInd').textContent = '';
  } else if (board.every(Boolean)) {
    over = true;
    scores.T++;
    updateScores();
    const msg = document.getElementById('msg');
    msg.textContent = 'A tie.';
    msg.className = 'msg';
    document.getElementById('turnInd').textContent = '';
  } else {
    turn = turn === 'X' ? 'O' : 'X';
    document.getElementById('turnInd').textContent = `${turn}'s turn`;
  }
  render();
}

function checkWin() {
  for (const [a,b,c] of WINS) {
    if (board[a] && board[a]===board[b] && board[b]===board[c]) return [a,b,c];
  }
  return null;
}

function updateScores() {
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreTie').textContent = scores.T;
}

function render() {
  const b = document.getElementById('board');
  b.innerHTML = board.map((v,i) =>
    `<div class="cell ${v.toLowerCase()}" onclick="move(${i})">${v}</div>`
  ).join('');
}

const saved = localStorage.getItem('just-theme');
if (saved === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent='Light'; }
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');document.getElementById('themeBtn').textContent='Dark';localStorage.setItem('just-theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='Light';localStorage.setItem('just-theme','dark');}
}

newGame();
</script>
</body>
</html>
