<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Just.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 8px;
    background: var(--border);
    padding: 8px;
    border-radius: 4px;
    width: fit-content;
    margin: 0 auto 1.5rem;
  }
  .tile {
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 1.6rem;
    border-radius: 2px;
    background: var(--tag);
    color: var(--text);
    font-weight: 400;
    transition: background 0.1s;
    user-select: none;
  }
  .t2{background:var(--card);} .t4{background:var(--bg2);}
  .t8{background:#c8a86e;color:#fff;} .t16{background:#c0906a;color:#fff;}
  .t32{background:#b87a5a;color:#fff;} .t64{background:#b06040;color:#fff;}
  .t128{background:#9a8040;color:#fff;font-size:1.2rem;}
  .t256{background:#887030;color:#fff;font-size:1.2rem;}
  .t512{background:#766020;color:#fff;font-size:1.2rem;}
  .t1024{background:#644800;color:#fff;font-size:1rem;}
  .t2048{background:#3a2800;color:#ffd700;font-size:1rem;}
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Back</a>
  <a href="../index.html" class="logo">Just<em>.</em></a>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark</button>
  </div>
</header>

<div class="game-container">
  <div class="game-title">2048</div>
  <div class="status-bar">
    <span>Score</span><span class="status-val" id="score">0</span>
    <span>Best</span><span class="status-val" id="best">0</span>
  </div>

  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>

  <div style="text-align:center;margin-top:0.5rem">
    <button class="btn btn-outline" onclick="newGame()">New Game</button>
  </div>
  <div style="text-align:center;margin-top:0.5rem;font-size:0.65rem;color:var(--text2);letter-spacing:0.08em">Arrow keys or swipe</div>
</div>

<script>
let grid, score, best=0, over;

function newGame(){
  grid=Array(4).fill(null).map(()=>Array(4).fill(0));
  score=0; over=false;
  addTile(); addTile();
  document.getElementById('score').textContent=0;
  document.getElementById('msg').textContent='';
  document.getElementById('msg').className='msg';
  render();
}

function addTile(){
  const empty=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}

function slide(row){
  let arr=row.filter(Boolean);
  let pts=0;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){arr[i]*=2;pts+=arr[i];arr.splice(i+1,1);}
  }
  while(arr.length<4) arr.push(0);
  return {row:arr,pts};
}

function move(dir){
  if(over) return;
  let moved=false, pts=0;
  const old=grid.map(r=>[...r]);
  if(dir==='left'){
    for(let r=0;r<4;r++){const {row,pts:p}=slide(grid[r]);grid[r]=row;pts+=p;}
  } else if(dir==='right'){
    for(let r=0;r<4;r++){const {row,pts:p}=slide([...grid[r]].reverse());grid[r]=row.reverse();pts+=p;}
  } else if(dir==='up'){
    for(let c=0;c<4;c++){
      const col=grid.map(r=>r[c]);
      const {row,pts:p}=slide(col);
      row.forEach((v,r)=>grid[r][c]=v);pts+=p;
    }
  } else if(dir==='down'){
    for(let c=0;c<4;c++){
      const col=grid.map(r=>r[c]).reverse();
      const {row,pts:p}=slide(col);
      row.reverse().forEach((v,r)=>grid[r][c]=v);pts+=p;
    }
  }
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]!==old[r][c]) moved=true;
  if(moved){
    score+=pts;
    if(score>best) best=score;
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
    addTile();
    checkEnd();
    render();
  }
}

function checkEnd(){
  if(grid.flat().includes(2048)){
    document.getElementById('msg').textContent='You reached 2048!';
    document.getElementById('msg').className='msg win';
    over=true; return;
  }
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    if(!grid[r][c]) return;
    if(c<3&&grid[r][c]===grid[r][c+1]) return;
    if(r<3&&grid[r][c]===grid[r+1][c]) return;
  }
  document.getElementById('msg').textContent='No moves left.';
  document.getElementById('msg').className='msg lose';
  over=true;
}

function render(){
  const b=document.getElementById('board');
  b.innerHTML=grid.flat().map(v=>`<div class="tile ${v?'t'+v:''}">${v||''}</div>`).join('');
}

document.addEventListener('keydown',e=>{
  const map={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

// Touch swipe
let tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
});

const saved = localStorage.getItem('just-theme');
if (saved === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent='Light'; }
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');document.getElementById('themeBtn').textContent='Dark';localStorage.setItem('just-theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='Light';localStorage.setItem('just-theme','dark');}
}

newGame();
</script>
</body>
</html>
